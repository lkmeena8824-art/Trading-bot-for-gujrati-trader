services:
  - type: web
    name: elite-sniper-bot
    runtime: docker
    plan: free
    branch: arena/01a06fdf-trading-bot-for-gujrati-trader
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # ---- secrets: set these in the Render dashboard, never in git ----
      - key: BOT_TOKEN
        sync: false
      - key: FREE_CHANNEL_ID
        sync: false
      - key: VIP_CHANNEL_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      # Optional paid AI keys. Leave unset for zero-cost mode.
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # ---- non-secret configuration ----
      - key: DATABASE_PATH
        value: /app/data/bot.db
      - key: MAX_DAILY_TRADES
        value: "3"
      - key: DATA_PROVIDER
        value: free
      - key: SIGNAL_SYMBOL
        value: NIFTY
      - key: AUTO_TRADE_CHANNEL
        value: FREE
      # ---- Phase 2: AI wording layer (off by default = zero cost) ----
      - key: AI_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: AI_MIN_INTERVAL_SECONDS
        value: "15"
      - key: AI_TIMEOUT_SECONDS
        value: "8"
      - key: AI_MAX_TOKENS
        value: "350"
      - key: AI_TEMPERATURE
        value: "0.3"
      - key: AI_DAILY_CALL_BUDGET
        value: "200"
      - key: AI_PERSONA_NAME
        value: Sniper Bhai
      - key: AI_STYLE_LANGUAGE
        value: hinglish
      # ---- Phase 2: contextual replies and memory ----
      - key: REPLY_ENABLED
        value: "true"
      - key: REPLY_COOLDOWN_SECONDS
        value: "20"
      - key: REPLY_MAX_PER_USER_PER_DAY
        value: "15"
      - key: REPLY_IN_GROUPS
        value: "false"
      - key: COMMUNITY_MEMORY_ENABLED
        value: "true"
      - key: POLL_TRACKING_ENABLED
        value: "true"
      - key: MARKET_MEMORY_DAYS
        value: "5"
